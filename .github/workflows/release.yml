name: Release

# Push a tag created by `npm run release:patch` (or minor/major). The published
# DMG (macOS) and Setup.exe (Windows) with their .sha256 files are what installed
# apps download through the in-app updater (electron/updater.cjs).
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (vX.Y.Z), must already exist
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Check tag matches package.json
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then echo "Tag $TAG khác package.json ($version)"; exit 1; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache-dependency-path: backend/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.12.1
      - run: npm ci
      - run: npm run lint
      - run: npm run test:go
      - run: npm run test:sync
      - run: npm run test:updater
      - name: Build universal DMG
        run: npm run desktop:build:mac
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify installer checksum
        shell: bash
        run: |
          cd release-desktop/mac
          shasum -a 256 -c "Viet-Latex-Studio-$VERSION-universal.dmg.sha256"
          mv manifest.json manifest-mac.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-mac
          if-no-files-found: error
          path: |
            release-desktop/mac/Viet-Latex-Studio-${{ env.VERSION }}-universal.dmg
            release-desktop/mac/Viet-Latex-Studio-${{ env.VERSION }}-universal.dmg.sha256
            release-desktop/mac/manifest-mac.json

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Check tag matches package.json
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then echo "Tag $TAG khác package.json ($version)"; exit 1; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache-dependency-path: backend/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.12.1
      - run: npm ci
      - run: npm run lint
      - run: npm run test:go
      - run: npm run test:updater
      - name: Build Windows installer
        run: npm run desktop:build:win
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify installer checksum
        shell: bash
        run: |
          cd release-desktop/win
          sha256sum -c "Viet-Latex-Studio-$VERSION-Setup.exe.sha256"
          mv manifest.json manifest-win.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-win
          if-no-files-found: error
          path: |
            release-desktop/win/Viet-Latex-Studio-${{ env.VERSION }}-Setup.exe
            release-desktop/win/Viet-Latex-Studio-${{ env.VERSION }}-Setup.exe.sha256
            release-desktop/win/manifest-win.json

  publish:
    needs: [mac, windows]
    # Publish whatever platform built; the updater on the other OS simply sees no installer yet.
    if: ${{ !cancelled() && (needs.mac.result == 'success' || needs.windows.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          notes="docs/UPGRADE-$version.md"
          if [ -f "$notes" ]; then notes_args=(--notes-file "$notes"); else notes_args=(--generate-notes); fi
          gh release create "$TAG" dist-release/* --title "Viet Latex Studio $version" --verify-tag "${notes_args[@]}"
